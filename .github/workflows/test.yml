name: Test

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run offline tests
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit libsqlite3-0
          ./tests/run.sh
