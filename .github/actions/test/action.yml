name: Complete offline tests
description: Run every spec with Node and a pinned official KOReader runtime.
runs:
  using: composite
  steps:
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: "22"

    # Release CDN 偶发 504；命中后整次 job 不再下载 30MB 包。
    - name: Cache KOReader archive
      id: koreader-archive
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/moon-koreader.tar.xz
        key: koreader-linux-x86_64-v2026.07.1-299aadb28147a25e9432ced1214ea444a4184393b5ae97cf42402c8a61b1a1b0

    - name: Prepare test dependencies
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
          luajit libsqlite3-0 xz-utils zlib1g-dev git

        VER=v2026.07.1
        SHA=299aadb28147a25e9432ced1214ea444a4184393b5ae97cf42402c8a61b1a1b0
        # koreader/koreader@v2026.07.1 的 linux-x86_64 asset id（API 下载用）
        ASSET_ID=497834403
        ARCHIVE="$RUNNER_TEMP/moon-koreader.tar.xz"
        RUNTIME="$PWD/koreader/koreader-emulator-ci-debug/koreader"

        download() {
          local url="$1"; shift
          local tmp="$ARCHIVE.download"
          rm -f "$tmp"
          curl --fail --location --retry 8 --retry-delay 5 --retry-all-errors \
            --connect-timeout 20 --max-time 300 \
            "$@" -o "$tmp" "$url"
          mv "$tmp" "$ARCHIVE"
        }

        if [[ ! -f "$ARCHIVE" ]]; then
          echo "KOReader archive cache miss; downloading…"
          if ! download \
            "https://github.com/koreader/koreader/releases/download/${VER}/koreader-linux-x86_64-${VER}.tar.xz"
          then
            echo "Browser URL failed; trying GitHub API asset download…"
            download \
              "https://api.github.com/repos/koreader/koreader/releases/assets/${ASSET_ID}" \
              -H "Accept: application/octet-stream" \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            || rm -f "$ARCHIVE"
          fi
        else
          echo "KOReader archive cache hit"
        fi

        if [[ -f "$ARCHIVE" ]]; then
          echo "${SHA}  ${ARCHIVE}" | sha256sum --check
          mkdir -p "$RUNTIME"
          tar -xJf "$ARCHIVE" -C "$RUNTIME" --strip-components=2 lib/koreader
          ln -sfn koreader-emulator-ci-debug/koreader/frontend koreader/frontend
          ln -sfn koreader-emulator-ci-debug/koreader koreader/base
        else
          # Release CDN 全挂时：源码树有 frontend，native 走测试 stub。
          echo "Release asset unavailable; cloning KOReader ${VER} frontend from git"
          git clone --depth 1 --branch "$VER" \
            https://github.com/koreader/koreader.git koreader
          test -f koreader/frontend/ui/uimanager.lua
        fi

    - name: Run every spec without skips
      shell: bash
      run: |
        set -euo pipefail
        LIBS="$PWD/koreader/koreader-emulator-ci-debug/koreader/libs"
        if [[ -d "$LIBS" ]]; then
          export LD_LIBRARY_PATH="$LIBS"
        fi
        node --version
        ./tests/run.sh | tee "$RUNNER_TEMP/moon-tests.log"
        ! grep -Eq '^[0-9]+ passed, [1-9][0-9]* skipped,' "$RUNNER_TEMP/moon-tests.log"

    - name: Check release tool isolation
      shell: bash
      run: python3 -c 'import sqlite3; print("Release SQLite:", sqlite3.sqlite_version)'
