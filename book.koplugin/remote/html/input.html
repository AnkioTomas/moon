<!DOCTYPE html>
<!-- 远程输入 / 共享剪贴板页（静态路由；逻辑在 /input.js，共享函数在 /js.js） -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>远程输入 - 远程管理</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="page-header">
<h1><a href="/">远程管理</a> <span class="crumb">/</span> 远程输入</h1>
</header>

<section class="panel" aria-labelledby="cb-title">
<h2 id="cb-title">共享剪贴板</h2>
<div id="cbstate" class="state" role="status" aria-live="polite"></div>
<label class="visually-hidden" for="cbtext">剪贴板文本</label>
<textarea id="cbtext" rows="8" placeholder="设备上还没有复制过文本"></textarea>
<div class="btns">
<button type="button" id="cbpull">从设备拉取</button>
<button type="button" id="cbpush" class="primary">写入设备</button>
<button type="button" id="cbcopy">复制到本机</button>
<button type="button" id="cbclear" class="danger">清空设备剪贴板</button>
</div>
</section>

<section class="panel" aria-labelledby="ri-title">
<h2 id="ri-title">远程输入</h2>
<div id="ristate" class="state" role="status" aria-live="polite">检测中…</div>
<label class="visually-hidden" for="ritext">待发送文本</label>
<textarea id="ritext" rows="5" disabled placeholder="设备上没有激活的输入框"></textarea>
<button type="button" id="risend" class="primary" disabled>追加到光标处</button>
</section>


<script src="/js.js"></script>
<script src="/input.js"></script>
</body>
</html>
