<!DOCTYPE html>
<!-- 远程输入页（静态路由；逻辑在 /input.js，共享函数在 /js.js） -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>远程输入 - 远程管理</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<h1><a href="/">远程管理</a> / 远程输入</h1>
<div id="ri">
<h2>远程输入</h2>
<div id="ristate">检测中…</div>
<textarea id="ritext" rows="6" disabled placeholder="设备上没有激活的输入框"></textarea>
<button id="risend" class="primary" disabled>发送到设备</button>
</div>
<p class="note">设备上打开任意输入框（搜索、重命名等）后，这里即可编辑发送；文本在点击发送时整段注入，不实时传输。</p>
<script src="/js.js"></script>
<script src="/input.js"></script>
</body>
</html>
