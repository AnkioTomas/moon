<!DOCTYPE html>
<!-- 远程输入页（静态路由；逻辑在 /input.js，共享函数在 /js.js） -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>远程输入 - 远程管理</title>
<link rel="stylesheet" href="/style.css">
</head>
<body class="utility-page">
<header class="brand-page-header">
<a class="brand-mini" href="/">
<img src="/logo.jpg" alt="" width="36" height="36"><span>月读</span>
</a>
<span class="brand-divider" aria-hidden="true"></span>
<h1>远程输入</h1>
</header>

<main class="single-page">
<section class="panel" aria-labelledby="ri-title">
<h2 id="ri-title">远程输入</h2>
<div id="ristate" class="state" role="status" aria-live="polite">检测中…</div>
<label class="visually-hidden" for="ritext">待发送文本</label>
<textarea id="ritext" rows="5" disabled placeholder="设备上没有激活的输入框"></textarea>
<button type="button" id="risend" class="primary" disabled>追加到光标处</button>
</section>
</main>

<footer class="site-footer"><span class="footer-brand"><img src="/logo.jpg" alt="" width="32" height="32"><span><strong>月读</strong><small>作者 Ankio</small></span></span><a class="footer-link" href="https://ankio.net" target="_blank" rel="noopener noreferrer">ankio.net ↗</a></footer>

<script src="/input.js"></script>
</body>
</html>
