<!DOCTYPE html>
<!-- 文件管理页（静态路由；逻辑在 /file.js，共享函数在 /js.js，配置经 /api/config） -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>文件管理 - 远程管理</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="page-header">
<h1><a href="/">远程管理</a> <span class="crumb">/</span> 文件管理</h1>
</header>

<div class="toolbar" role="toolbar" aria-label="目录导航">
<button type="button" id="back" disabled>← 返回</button>
<span id="quick"></span>
</div>

<div id="path" class="path" aria-live="polite"></div>
<p class="note" id="booktip">书籍根目录约定：第 2 级目录为分类，第 3 级目录为系列（分类 / 系列 / 书籍）。</p>

<div class="toolbar actions" role="toolbar" aria-label="文件操作">
<label class="file-input">
<span class="visually-hidden">选择文件</span>
<input type="file" id="file" multiple>
</label>
<button type="button" id="up" class="primary">上传到当前目录</button>
<button type="button" id="mk">新建文件夹</button>
</div>

<pre id="log" class="log" aria-live="polite"></pre>

<div class="table-wrap">
<table>
<thead>
<tr><th scope="col">名称</th><th scope="col">大小</th><th scope="col">修改时间</th><th scope="col"><span class="visually-hidden">操作</span></th></tr>
</thead>
<tbody id="list"></tbody>
</table>
</div>
<div id="preview" class="preview" aria-label="图片预览"></div>

<div id="ov" class="overlay" hidden>
<div id="dlg" class="dialog" role="dialog" aria-modal="true" aria-labelledby="dt">
<h2 id="dt"></h2>
<p id="dm"></p>
<label id="dilabel" class="visually-hidden" for="di">输入</label>
<input id="di" type="text" hidden>
<div class="btns">
<button type="button" id="dc">取消</button>
<button type="button" id="dk" class="primary">确定</button>
</div>
</div>
</div>

<script src="/js.js"></script>
<script src="/file.js"></script>
</body>
</html>
