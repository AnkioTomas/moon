<!DOCTYPE html>
<!-- 共享剪贴板页（静态路由；逻辑在 /clipboard.js，共享函数在 /js.js） -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>共享剪贴板 - 远程管理</title>
<link rel="stylesheet" href="/style.css">
</head>
<body class="utility-page">
<header class="brand-page-header">
<a class="brand-mini" href="/">
<img src="/logo.jpg" alt="" width="36" height="36"><span>月读</span>
</a>
<span class="brand-divider" aria-hidden="true"></span>
<h1>共享剪贴板</h1>
</header>

<main class="single-page">
<section class="panel" aria-labelledby="cb-title">
<h2 id="cb-title">共享剪贴板</h2>
<div id="cbstate" class="state" role="status" aria-live="polite"></div>
<label class="visually-hidden" for="cbtext">剪贴板文本</label>
<textarea id="cbtext" rows="12" placeholder="设备上还没有复制过文本"></textarea>
<div class="btns">
<button type="button" id="cbpull">从设备拉取</button>
<button type="button" id="cbpush" class="primary">写入设备</button>
<button type="button" id="cbcopy">复制到本机</button>
<button type="button" id="cbclear" class="danger">清空设备剪贴板</button>
</div>
</section>
</main>

<footer class="site-footer"><span class="footer-brand"><img src="/logo.jpg" alt="" width="32" height="32"><span><strong>月读</strong><small>作者 Ankio</small></span></span><a class="footer-link" href="https://ankio.net" target="_blank" rel="noopener noreferrer">ankio.net ↗</a></footer>
<script src="/js.js"></script>
<script src="/clipboard.js"></script>
</body>
</html>
