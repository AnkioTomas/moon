<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>月读</title>
<link rel="stylesheet" href="/style.css">
<style>
main{max-width:520px;margin:12vh auto;padding:24px}
.panel{padding:24px}
img{display:block;margin:16px 0;max-width:100%;height:auto;background:#fff}
input{width:100%;box-sizing:border-box;margin:8px 0 16px;padding:12px;font-size:18px}
#status{overflow-wrap:anywhere}
</style>
</head>
<body>
<main><section class="panel">
<h1 id="title">月读</h1>
<p id="instruction"></p>
<img id="captcha" alt="">
<input id="code" autocomplete="off" inputmode="text">
<button id="send" type="button"></button>
<p id="status" role="status" aria-live="polite"></p>
</section></main>
<script src="/netease_verify.js"></script>
</body>
</html>
